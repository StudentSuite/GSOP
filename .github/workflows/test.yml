name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]   # macos-14 is Apple silicon (arm64), like Shaurya's M1
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true                 # caches the uv download/wheel cache, keyed on uv.lock
          cache-dependency-glob: uv.lock

      - name: Fail if uv.lock is out of date
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Provenance audit (warning only)
        continue-on-error: true
        run: uv run python scripts/audit_provenance.py
