operators:
  grid_crs: "EPSG:6933"
  tile_m: 6000
  baseline_m: 500
  slope_method: horn
  max_nan_fraction: 0.2
  earth_dem: {nasadem_lat_range: [-56, 60]}
illumination:
  low_sun_deg: 5
  days_per_year: 360
  tilted_days: 72
  hour_samples: 96
  bodies:
    earth: {obliquity_deg: 23.44, solar_irradiance_w_m2: 1361.0, source: test, verified_on: "2026-11-14"}
    moon: {obliquity_deg: 1.54, solar_irradiance_w_m2: 1361.0, source: test, verified_on: null}
    mars: {obliquity_deg: 25.19, solar_irradiance_w_m2: 586.2, source: test, verified_on: "2026-11-14"}
temperature: {start_year: 2015, end_year: 2024, lst_scale_kelvin: 0.02, min_valid_obs_total: 100, min_valid_obs_per_month: 5, dry_months: 3, dry_season_ratio_max: 0.5, precip_scale: 1.0}
water_index: {aridity_ai_cap: 1.0, permafrost_asset: null, permafrost_outside_domain: nan}
silica_index: {formula: quartz_index, aster_emissivity_scale: 0.001}
features:
  slope_med:
    definition: "median slope at 500 m"
    units: deg
    sources: {earth: {name: "DEM", lead: true}, moon: {name: LOLA}, mars: {name: MOLA}}
    evidence_grade: A
    uncertainty:
      moon: {min: 1.5, max: 2.5, unit: deg, source: "Barker 2021"}
      earth: TODO
  slope_p90:
    definition: "90th percentile slope at 500 m"
    units: deg
    sources: {earth: {name: "DEM", lead: true}, moon: {name: LOLA}, mars: {name: MOLA}}
    evidence_grade: A
    uncertainty: {earth: TODO}
  sun_max_elev:
    definition: "highest Sun elevation"
    units: deg
    sources: {earth: {name: computed}, moon: {name: computed}, mars: {name: computed}}
    evidence_grade: B
    uncertainty: {earth: TODO}
    proxy: true
gate_layers:
  water_ice_fraction: {definition: "water or permanent ice share"}
