operators:
  grid_crs: "EPSG:6933"
  tile_m: 6000
  baseline_m: 500
  slope_method: horn
  max_nan_fraction: 0.2
  earth_dem: {nasadem_lat_range: [-56, 60]}
illumination:
  low_sun_deg: 5
  days_per_year: 360
  tilted_days: 72
  hour_samples: 96
  bodies:
    earth: {obliquity_deg: 23.44, solar_irradiance_w_m2: 1361.0, source: test, verified_on: "2026-11-14"}
    moon: {obliquity_deg: 1.54, solar_irradiance_w_m2: 1361.0, source: test, verified_on: null}
    mars: {obliquity_deg: 25.19, solar_irradiance_w_m2: 586.2, source: test, verified_on: "2026-11-14"}
temperature: {start_year: 2015, end_year: 2024, lst_scale_kelvin: 0.02, min_valid_obs_total: 100, min_valid_obs_per_month: 5, dry_months: 3, dry_season_ratio_max: 0.5, precip_scale: 1.0}
water_index: {aridity_ai_cap: 1.0, permafrost_asset: null, permafrost_outside_domain: nan}
silica_index: {formula: quartz_index, aster_emissivity_scale: 0.001}
air_density:
  universal_gas_constant_j_mol_k: 8.314462618
  earth: {model: standard_atmosphere, sea_level_temperature_k: 288.15, sea_level_pressure_pa: 101325, lapse_rate_k_per_m: 0.0065, specific_gas_constant_j_kg_k: 287.0528, gravity_m_s2: 9.80665, max_elevation_m: 11000, source: test}
  mars: {model: exponential, surface_pressure_pa: 636.0, scale_height_m: 11000.0, temperature_k: 214.0, molar_mass_g_mol: 43.49, reference_elevation_m: 0.0, source: test}
land_cover: {year: 2023, water_ice_classes: [15, 17], builtup_cropland_classes: [12, 13, 14], ndvi_good_summary_qa: [0, 1]}
earth_export: {chunk_lat_deg: 15, chunk_lon_deg: 15, max_retries: 3, poll_seconds: 60, destination: drive, drive_folder: gsop_earth, cloud_bucket: null}
earth_build: {land_min_fraction: 0.5, nan_warn_fraction: 0.2, expected_land_tiles: 4000000, expected_land_tolerance: 0.25, dust_percentiles: [1, 99]}
features:
  slope_med:
    definition: "median slope at 500 m"
    units: deg
    sources: {earth: {name: "DEM", lead: true}, moon: {name: LOLA}, mars: {name: MOLA}}
    evidence_grade: A
    earth_bias: TODO
    uncertainty:
      moon: {min: 1.5, max: 2.5, unit: deg, source: "Barker 2021"}
      earth: TODO
  slope_p90:
    definition: "90th percentile slope at 500 m"
    units: deg
    sources: {earth: {name: "DEM", lead: true}, moon: {name: LOLA}, mars: {name: MOLA}}
    evidence_grade: A
    earth_bias: TODO
    uncertainty: {earth: TODO}
  sun_max_elev:
    definition: "highest Sun elevation"
    units: deg
    sources: {earth: {name: computed}, moon: {name: computed}, mars: {name: computed}}
    evidence_grade: B
    earth_bias: TODO
    uncertainty: {earth: TODO}
    proxy: true
gate_layers:
  water_ice_fraction: {definition: "water or permanent ice share"}
