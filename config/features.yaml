# Feature columns, per-body sources and measurement-uncertainty floors
# (setup prompt section A3 "features.yaml" and issue A10).
#
# Reading guide
#   sources.<body>.lead: true   an Earth source that is a LEAD to verify in the live catalog, not a fact.
#                               Verified ids go to docs/PROVENANCE.md; unverified ones to docs/UNVERIFIED.md.
#   evidence_grade              A measured, B computed or same class, C inference or cross-instrument proxy.
#                               These grades are a first draft and still need review (docs/UNVERIFIED.md).
#   availability.<body>         optional. status is available | usable_with_caveat | unavailable, with a reason.
#                               `unavailable` means the missing-data gate must reject the tile (no silent
#                               substitution). Verdicts come from docs/PROVENANCE.md.
#   proxy: true                 cross-instrument proxy. water_index and silica_index are the two weakest
#                               comparisons in the whole index; the site must say so.
#   uncertainty.<body>          measurement-uncertainty floor for the sigma rule:
#                                 sigma_k = max(target_spread_k, measurement_uncertainty_k, 0.25 * IQR_k).
#                               It is either a sourced {min, max, unit, source} range or the string TODO.
#                               TODO means no source yet: the IQR term then carries the sigma. The sigma code
#                               takes `max` from a sourced range (the conservative end); that choice is listed
#                               in docs/UNVERIFIED.md.
# Terrain operator settings, shared by the Earth Engine path and numpy `operators.py` (docs/SPEC.md, Operators).
operators:
  grid_crs: "EPSG:6933"       # decision D1: equal-area grid
  tile_m: 6000                # decision D1: 6 km tiles
  baseline_m: 500             # one shared baseline for slope and relief on Earth, Moon and Mars
  slope_method: horn          # Horn (1981) 3x3 finite difference; see SPEC for why
  max_nan_fraction: 0.2       # TUNABLE, NOT SOURCED: a tile with more than this share of missing cells is NaN
  earth_dem:
    # NASADEM (verified in docs/PROVENANCE.md: catalog bounding box -56 to 60 latitude) is used inside this
    # latitude range, Copernicus GLO-30 outside it. Setup prompt says "56S to 60N" and "Copernicus above
    # 60N"; south of 56S has no SRTM, so Copernicus is used there too (documented deviation, see SPEC).
    nasadem_lat_range: [-56, 60]

# Illumination settings and body constants for src/gsop/illumination.py (one analytic implementation for all bodies).
illumination:
  low_sun_deg: 5              # "share of daylight with the Sun under 5 deg" (setup prompt, features.yaml notes)
  days_per_year: 360          # TUNABLE: samples of the Sun's ecliptic longitude per year (analytic day integrals)
  tilted_days: 72             # TUNABLE: days sampled when a slope and aspect are given (numeric hour-angle quadrature)
  hour_samples: 96            # TUNABLE: hour angles per day for the tilted quadrature
  bodies:
    earth:
      obliquity_deg: 23.44
      solar_irradiance_w_m2: 1361.0
      source: "NASA Earth Fact Sheet (nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html): obliquity to orbit 23.44, solar irradiance 1361.0"
      verified_on: "2026-11-14"
    moon:
      obliquity_deg: 1.54     # Sun's declination range as seen from the Moon: tilt of the lunar equator to the ecliptic
      solar_irradiance_w_m2: 1361.0
      source: "irradiance: NASA Moon Fact Sheet (moonfact.html) 1361.0. obliquity: NOT on that sheet (it lists 6.68 to the orbit plane, which is not the Sun-relevant tilt). 1.54 is from general knowledge, consistent with the setup prompt's 'Sun within about 1.5 deg of the horizon'. UNVERIFIED."
      verified_on: null
    mars:
      obliquity_deg: 25.19
      solar_irradiance_w_m2: 586.2
      source: "NASA Mars Fact Sheet (nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html): obliquity to orbit 25.19, solar irradiance 586.2 (the page does not say at which distance)"
      verified_on: "2026-11-14"

# Earth temperature climatology from MODIS LST (MOD11A2, verified in docs/PROVENANCE.md). Method in docs/SPEC.md.
temperature:
  start_year: 2015            # setup prompt: "Use 2015-2024 climatology for MODIS"
  end_year: 2024
  lst_scale_kelvin: 0.02      # catalog page: LST_Day_1km / LST_Night_1km scale 0.02, units K
  min_valid_obs_total: 100    # TUNABLE, NOT SOURCED: fewer valid 8-day composites than this over all years -> low_obs
  min_valid_obs_per_month: 5  # TUNABLE, NOT SOURCED: a calendar month with fewer valid composites is not used for t_coldest
  # ti_proxy (dry-season day-night swing), issue B10. Dry season = the `dry_months` consecutive (cyclic) calendar
  # months with the least precipitation (TerraClimate `pr`, same years). It only counts as a dry season when it
  # is clearly drier than average: driest-3-month precipitation < dry_season_ratio_max * (annual precipitation / 4).
  dry_months: 3               # setup prompt: "three driest consecutive months"
  dry_season_ratio_max: 0.5   # TUNABLE, NOT SOURCED
  precip_scale: 1.0           # multiplier to turn TerraClimate `pr` into mm. The catalog page lists no unit/scale: UNVERIFIED

# Earth water_index = mean(permafrost probability, dryness 0-1). See docs/SPEC.md and the B04 verdicts in docs/PROVENANCE.md.
water_index:
  aridity_ai_cap: 1.0         # TUNABLE, NOT SOURCED: aridity index P/PET at or above this counts as fully humid (dryness 0)
  # No permafrost layer is in the Earth Engine catalog (B04). Give the id of an Earth Engine asset holding a
  # 0-1 permafrost-probability raster (for example an upload of the Northern-Hemisphere map) to build water_index.
  # While this is null, water_index is UNAVAILABLE everywhere and the missing-data gate rejects every tile for
  # any target whose weights use it. DECISION NEEDED from Anay (docs/UNVERIFIED.md).
  permafrost_asset: null
  # What to do where the permafrost raster has no value: `nan` (water_index missing, honest, rejects the tile)
  # or `zero` (treat as no permafrost; lets the Southern Hemisphere and non-permafrost land be scored).
  permafrost_outside_domain: nan

# Earth silica_index = ASTER Quartz Index QI = (e11 * e11) / (e10 * e12), emissivity bands of ASTER GED. Method in docs/SPEC.md.
silica_index:
  formula: quartz_index       # Ninomiya et al. 2005 (Remote Sensing of Environment), QI as quoted in arXiv 1107.3499
  aster_emissivity_scale: 0.001   # catalog page: emissivity_band10..14 scale 0.001

# air_density constants (issue B14). Every constant has a source; an unsourced one would say TODO. Moon: not used.
air_density:
  universal_gas_constant_j_mol_k: 8.314462618   # SI 2019 exact value (R = N_A * k_B). Not re-checked in this session.
  earth:
    model: standard_atmosphere                  # troposphere of the International Standard Atmosphere, valid to 11 km
    sea_level_temperature_k: 288.15             # Wikipedia, International Standard Atmosphere (read 2026-11-14)
    sea_level_pressure_pa: 101325               # same page
    lapse_rate_k_per_m: 0.0065                  # same page: 6.5 K/km
    specific_gas_constant_j_kg_k: 287.0528      # same page: dry air
    gravity_m_s2: 9.80665                       # standard gravity (conventional exact value, CGPM 1901); the ISA page gives no number: not re-checked
    max_elevation_m: 11000                      # above this the troposphere formula does not apply
    source: "International Standard Atmosphere, en.wikipedia.org/wiki/International_Standard_Atmosphere (read 2026-11-14)"
  mars:
    model: exponential                          # isothermal atmosphere: rho = rho0 * exp(-h / H)
    surface_pressure_pa: 636.0                  # NASA Mars Fact Sheet: 6.36 mb "at mean radius" (varies 4.0-8.7 mb with season)
    scale_height_m: 11000.0                     # same sheet: 11.0 km
    temperature_k: 214.0                        # same sheet: average temperature ~214 K
    molar_mass_g_mol: 43.49                     # same sheet: mean molecular weight 43.49
    reference_elevation_m: 0.0                  # TODO UNSOURCED: assumes MOLA elevation 0 m is where the stated pressure applies (the sheet says "at mean radius")
    source: "NASA Mars Fact Sheet, nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html (read 2026-11-14)"

# Gate layers (issue B15). Thresholds are NOT applied at export time; they live in gates.yaml.
land_cover:
  year: 2023                          # TUNABLE, NOT SOURCED: MCD12Q1 year used (page lists 2001-2024); a recent complete year
  water_ice_classes: [15, 17]         # MCD12Q1 LC_Type1: 15 permanent snow and ice, 17 water bodies (catalog page, PROVENANCE)
  builtup_cropland_classes: [12, 13, 14]   # 12 cropland, 13 urban and built-up, 14 cropland/natural vegetation mosaic.
                                      # TUNABLE: class 14 is only partly farmed and may overstate the fraction; drop it to be stricter
  ndvi_good_summary_qa: [0, 1]        # MOD13A2 SummaryQA kept: 0 good, 1 marginal (2 snow/ice and 3 cloudy are dropped)

# Global export orchestration (issue B16). Chunk size, retries, destination: all tunable, none sourced.
earth_export:
  chunk_lat_deg: 15           # the globe is cut into lat/lon blocks so no single export times out
  chunk_lon_deg: 15
  max_retries: 3              # a failed chunk is restarted this many times before the run reports it
  poll_seconds: 60
  destination: drive          # drive | cloud_storage (ask Anay which one is available)
  drive_folder: gsop_earth
  cloud_bucket: null          # set only with destination: cloud_storage

features:
  slope_med:
    definition: "Median over the 6 km tile of slope computed at one shared 500 m baseline"
    units: deg
    sources:
      earth: {name: "NASADEM (SRTM) between 56S and 60N; Copernicus DEM GLO-30 above 60N", lead: true}
      moon: {name: LOLA}
      mars: {name: MOLA}
    evidence_grade: A
    uncertainty:
      earth: TODO
      moon: {min: 1.5, max: 2.5, unit: deg, source: "Barker 2021 (south pole landing DEMs, 5 m per pixel; slope error)"}
      mars: TODO

  slope_p90:
    definition: "90th percentile over the 6 km tile of slope computed at one shared 500 m baseline"
    units: deg
    sources:
      earth: {name: "NASADEM (SRTM) between 56S and 60N; Copernicus DEM GLO-30 above 60N", lead: true}
      moon: {name: LOLA}
      mars: {name: MOLA}
    evidence_grade: A
    uncertainty:
      earth: TODO
      moon: {min: 1.5, max: 2.5, unit: deg, source: "Barker 2021 (south pole landing DEMs, 5 m per pixel; slope error)"}
      mars: TODO

  relief:
    definition: "Elevation range (max minus min of 500 m cells) in the 6 km tile"
    units: m
    sources:
      earth: {name: "NASADEM (SRTM) between 56S and 60N; Copernicus DEM GLO-30 above 60N", lead: true}
      moon: {name: LOLA}
      mars: {name: MOLA}
    evidence_grade: A
    uncertainty:
      earth: TODO
      moon: {min: 0.3, max: 0.5, unit: m, source: "Barker 2021 (south pole landing DEMs, 5 m per pixel; height error)"}
      mars: TODO

  rough_a:
    definition: "RMS height after plane removal at the shorter baseline"
    units: m
    baseline_m: 100            # default ~100 m. TODO confirm with Vihaan
    sources:
      earth: {name: "NASADEM (SRTM) between 56S and 60N; Copernicus DEM GLO-30 above 60N", lead: true}
      moon: {name: LOLA}
      mars: {name: MOLA}
    evidence_grade: A
    uncertainty:
      earth: TODO
      moon: {min: 0.3, max: 0.5, unit: m, source: "Barker 2021 (south pole landing DEMs, 5 m per pixel; height error)"}
      mars: TODO

  rough_b:
    definition: "RMS height after plane removal at the longer baseline"
    units: m
    baseline_m: 1000           # default ~1 km. TODO confirm with Vihaan
    sources:
      earth: {name: "NASADEM (SRTM) between 56S and 60N; Copernicus DEM GLO-30 above 60N", lead: true}
      moon: {name: LOLA}
      mars: {name: MOLA}
    evidence_grade: A
    uncertainty:
      earth: TODO
      moon: {min: 0.3, max: 0.5, unit: m, source: "Barker 2021 (south pole landing DEMs, 5 m per pixel; height error)"}
      mars: TODO

  sun_max_elev:
    definition: "Highest Sun elevation over the year, computed from latitude, obliquity and slope/aspect"
    units: deg
    sources:
      earth: {name: "computed from latitude, obliquity, slope/aspect"}
      moon: {name: "computed; Glaser 2018 values for the two lunar sites. Pole targets: Sun within about 1.5 deg of the horizon all year (sun_max_elev ~ 1.5)"}
      mars: {name: "computed from latitude, obliquity, slope/aspect"}
    evidence_grade: B
    uncertainty:
      earth: TODO
      moon: TODO
      mars: TODO

  sun_low_share:
    definition: "Share of daylight with the Sun under 5 deg above the horizon"
    units: "fraction 0-1"
    sources:
      earth: {name: "computed from latitude, obliquity, slope/aspect"}
      moon: {name: "computed; Glaser 2018 values for the two lunar sites. Pole targets: sun_low_share ~ 1.0"}
      mars: {name: "computed from latitude, obliquity, slope/aspect"}
    evidence_grade: B
    uncertainty:
      earth: TODO
      moon: TODO
      mars: TODO

  insol_annual:
    definition: "Annual insolation computed from latitude, obliquity and slope/aspect (Mars sunlight family)"
    units: "W/m2, annual mean on a flat surface (unit set in issue B08)"
    sources:
      earth: {name: "computed from latitude, obliquity, slope/aspect"}
      moon: null
      mars: {name: "computed from latitude, obliquity, slope/aspect"}
    evidence_grade: B
    uncertainty:
      earth: TODO
      mars: TODO

  t_mean:
    definition: "Annual mean surface temperature"
    units: K
    sources:
      earth: {name: "MODIS land-surface temperature, 2015-2024 climatology", lead: true}
      moon: {name: "Diviner (not available at the pole; flag)"}
      mars: {name: "Mars climate data (dataset not chosen yet)", lead: true}
    evidence_grade: A
    uncertainty:
      earth: TODO
      moon: TODO
      mars: TODO

  t_coldest:
    definition: "Coldest-month surface temperature"
    units: K
    sources:
      earth: {name: "MODIS land-surface temperature, 2015-2024 climatology", lead: true}
      moon: {name: "Diviner (not available at the pole; flag)"}
      mars: {name: "Mars climate data (dataset not chosen yet)", lead: true}
    evidence_grade: A
    uncertainty:
      earth: TODO
      moon: TODO
      mars: TODO

  ti_proxy:
    definition: "Day-night temperature swing in the dry season (three driest consecutive months; falls back to the annual median and flags it)"
    units: K
    sources:
      earth: {name: "MODIS land-surface temperature, 2015-2024 climatology", lead: true}
      moon: {name: Diviner}
      mars: {name: THEMIS}
    evidence_grade: B
    uncertainty:
      earth: TODO
      moon: TODO
      mars: TODO

  dust_index:
    availability:
      earth: {status: usable_with_caveat, reason: "Only coarse dust layers exist: MERRA-2 dust extinction AOT (NASA/GSFC/MERRA/aer/2, band DUEXTTAU, 69375 x 55000 m cells, about ten times coarser than a tile) is atmospheric dust, while the Mars side (TES) is surface albedo and dust cover. MODIS MAIAC aerosol is not dust-specific and was not chosen. Verdict B04; if B12 cannot build it the Mars thermal_inertia family uses ti_proxy alone."}
    definition: "How much dust is in the air or on the surface. Mars profile only: second column of the thermal_inertia family, sharing its weight"
    units: "TODO unit not fixed in the setup prompt"
    sources:
      earth: {name: "MERRA-2 dust or MODIS aerosol", lead: true}
      moon: null
      mars: {name: "TES albedo and dust cover"}
    evidence_grade: C
    uncertainty:
      earth: TODO
      mars: TODO

  water_index:
    availability:
      earth: {status: usable_with_caveat, reason: "Aridity is buildable (TerraClimate pr and pet, 4638 m, in Earth Engine). No permafrost-probability layer exists in the Earth Engine catalog; the only 1 km open product found (Obu et al. 2019, PANGAEA DOI 10.1594/PANGAEA.888600) covers the Northern Hemisphere only. DECISION NEEDED (Anay): without a rule for the Southern Hemisphere every southern tile, including McMurdo and the Atacama, would have no water_index and the missing-data gate would reject it. Verdict B04."}
    definition: "0-1 index. Earth: mean of permafrost probability and a 0-1 aridity index. Moon: PSR share of the tile. Mars: SWIM ice consistency. Cross-instrument proxy."
    units: "index 0-1"
    proxy: true
    sources:
      earth: {name: "permafrost probability map plus an aridity index from GPM precipitation and SMAP soil moisture (no dataset chosen yet)", lead: true}
      moon: {name: "PSR share of the tile"}
      mars: {name: "SWIM ice consistency (swim.psi.edu)"}
    evidence_grade: C
    uncertainty:
      earth: TODO
      moon: TODO
      mars: TODO

  silica_index:
    definition: "Thermal-infrared emissivity band ratio. Cross-instrument proxy."
    units: "unitless band ratio"
    proxy: true
    sources:
      earth: {name: "ASTER GED (EMIT only where available)", lead: true}
      moon: {name: "Diviner Christiansen feature"}
      mars: {name: TES}
    evidence_grade: C
    uncertainty:
      earth: TODO
      moon: TODO
      mars: TODO

  air_density:
    definition: "Air density from elevation (Mars family only). Earth: standard atmosphere. Mars: exponential pressure law; constants must come from config with a source."
    units: "kg/m3"
    sources:
      earth: {name: "standard-atmosphere density from elevation (elevation from the same DEMs as slope)"}
      moon: null
      mars: {name: "exponential pressure law on MOLA elevation. TODO constants are not sourced yet"}
    evidence_grade: B
    uncertainty:
      earth: TODO
      mars: TODO

# Earth-only layers used by the gates (gates.yaml). They are not scored.
gate_layers:
  water_ice_fraction:
    band: gate_water_ice_frac
    definition: "Share of the tile covered by open water or permanent ice"
    units: "fraction 0-1"
    sources:
      earth: {name: "MODIS land cover MCD12Q1 (MODIS/061/MCD12Q1), classes 17 and 15; verified in PROVENANCE", lead: false}
  ndvi_median:
    band: gate_ndvi_med
    definition: "Median NDVI over the tile"
    units: "NDVI -1 to 1"
    sources:
      earth: {name: "MODIS NDVI, 2015-2024", lead: true}
  builtup_cropland_fraction:
    band: gate_built_crop_frac
    definition: "Share of the tile that is built-up or farmed land"
    units: "fraction 0-1"
    sources:
      earth: {name: "MODIS land cover MCD12Q1 (MODIS/061/MCD12Q1), classes 12, 13, 14; verified in PROVENANCE", lead: false}
