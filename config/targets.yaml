# Targets: the fixed side of every comparison (setup prompt section A3).
# "Shackleton ridge" means Connecting Ridge C1, everywhere. Do not use C2.
# Values are copied character for character from the setup prompt. Do not guess any coordinate.
moon:
  connecting_ridge_c1: {lat: -89.45, lon_e: 222.84, source: "Glaser 2018", lit_surface_pct: 76.0, lit_2m_pct: 88.0, max_shadow_h_surface: 268, max_shadow_h_2m: 112, nearest_psr_m: 100, psr_slope_deg: 8.4}
  shackleton_rim:      {lat: -89.78, lon_e: 203.97, source: "Glaser 2018", lit_surface_pct: 81.0, lit_2m_pct: 85.5, max_shadow_h_surface: 221, max_shadow_h_2m: 66, nearest_psr_m: 370}
mars:
  jezero:  {lat: 18.4386, lon_e: 77.5031, source: "Grant 2018"}
  arcadia: {lat: null, lon_e: null, source: "centre to be taken from the SWIM ice map", status: unscored_no_target_data}   # decision D10: never guess

# Features are computed on 6 km tiles (stride below) inside this window around each target.
# Target value = median over those tiles; spread = IQR / spread_iqr_divisor.
target_window_km: 15
tile_stride_km: 3
spread_iqr_divisor: 1.349
# Receiver height used for illumination. A parameter; default 2 m.
receiver_height_m: 2
