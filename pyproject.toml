[project]
name = "gsop"
version = "0.1.0"
description = "Geospatial Similarity Observation Platform: score Earth land tiles against Moon-base and Mars landing targets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "rasterio",
    "pyproj",
    "shapely",
    "psutil",
    "pyyaml",
    "typer",
    "rich",
    "tqdm",
    "requests",
    "earthengine-api",
    "pytest",
]

[project.scripts]
gsop = "gsop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "slow: long-running test, skipped unless you pass --runslow",
]
filterwarnings = [
    "ignore::PendingDeprecationWarning:rasterio.*",
]
